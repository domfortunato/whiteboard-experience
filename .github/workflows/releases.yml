name: Release Module

on:
  push:
    branches: [main]
    paths:
      - 'module.json'
  # Manual run: build and publish the GitHub release for the current module.json version
  # if its tag does not exist yet (gm-lock: this fork never publishes to the Foundry package
  # listing, which belongs to upstream, so the dry_run input is gone with that step).
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # gm-lock (this fork): GITHUB_TOKEN is read-only by default on repositories created since
    # 2023, and the release step below needs to create a tag and a release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Читаем версию из module.json
      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      # Проверяем, существует ли уже такой тег (на GitHub: checkout@v4 не скачивает теги)
      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Создаём zip (укажи свои файлы!)
      - name: Create zip
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          zip -r module.zip \
            module.json \
            scripts/ \
            styles/ \
            templates/ \
            lang/

      # Создаём релиз
      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          artifacts: 'module.json,module.zip'
          token: ${{ secrets.GITHUB_TOKEN }}

      # gm-lock (this fork): upstream's "Publish to Foundry package listing" step is removed.
      # The package id is upstream's; a fork must never publish releases against it, so
      # there is no FOUNDRY_RELEASE_TOKEN here and no code path that could use one.
